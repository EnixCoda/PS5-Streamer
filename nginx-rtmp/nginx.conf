worker_processes  1;

events {
    worker_connections  1024;
}

rtmp {
    server {
        # RTMP default port — PS5 streams to this after DNS hijack redirects it here
        listen 1935;

        # Stream application name — clients pull from rtmp://<host>/app/<stream-key>
        application app {
            # Enable live streaming (no recording)
            live on;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Serve RTMP statistics as XML, transformed by stat.xsl for human-readable HTML
        location / {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        # Serve the XSL stylesheet used to render the stats page
        location /stat.xsl {
            root /opt/nginx/html;
        }
    }
}