#dnsmasq config, for a complete example, see:
#  http://oss.segetech.com/intra/srv/dnsmasq.conf

# Don't use /etc/resolv.conf upstream nameservers; only use servers defined below
no-resolv
# Query upstream servers in the order listed, not in parallel
strict-order

# Use a public DNS as the upstream resolver (114.114.114.114 is a Chinese public DNS)
server=114.114.114.114

# Hijack PS5's Twitch RTMP ingest domain to redirect the stream to nginx-rtmp on the local host.
# PS5 streams to contribute.live-video.net; we resolve it to the host machine's LAN IP instead.
# Change 192.168.1.1 to match your actual host machine IP on the local network.
address=/contribute.live-video.net/192.168.1.1
